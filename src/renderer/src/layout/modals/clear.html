<div class="modal-mask" id="clear-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="clear-title">
      <h3 id="clear-title">清除区域清单</h3>
      <p class="clear-sub" id="clear-sub"></p>
      <ul class="clear-list" id="clear-list"></ul>
      <p class="modal-note">清除后需要重新抓取该区域；只影响当前平台的产物，其它区域与平台不受影响。</p>
      <p class="modal-error" id="clear-error" hidden></p>
      <div class="modal-actions">
        <button class="btn ghost" id="btn-clear-cancel">取消</button>
        <button class="btn danger" id="btn-clear-confirm">确认清除</button>
      </div>
    </div>
  </div>
