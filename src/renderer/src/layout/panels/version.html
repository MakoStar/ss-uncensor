<section class="panel" id="panel-version">
      <div class="card controls">
        <div class="toolbar">
          <div class="tool-group">
            <span class="select-wrap">
              <select id="version-platform" class="platform-select" aria-label="平台"></select>
            </span>
            <label class="path-field">
              <span>版本文件</span>
              <input type="text" id="version-path" class="path-input mono" spellcheck="false" placeholder="output/Manifest/win_version.json" />
            </label>
          </div>
          <div class="actions">
            <button class="btn ghost" id="btn-open-manifest">打开目录</button>
            <button class="btn primary" id="btn-version">读取</button>
          </div>
        </div>
        <div class="hint" id="version-status"></div>
      </div>
      <div class="card table-card" id="version-card">
        <div class="refresh-bar"></div>
        <table class="grid" id="version-table">
          <thead>
            <tr><th>区域</th><th>client_ver</th><th>game_ver</th><th>patch_num</th><th>version_str</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
