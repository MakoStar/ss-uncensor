<div class="modal-mask" id="dl-modal" hidden>

      <div class="modal-note" id="dl-done-file"></div>
      <div class="kv-tiles" id="dl-done-kv"></div>
      <p class="modal-error" id="dl-done-error" hidden></p>
      <div class="modal-actions">
        <button class="btn ghost" id="btn-dl-open">查看目录</button>

        <span class="spacer"></span>
        <button class="btn primary" id="btn-dl-close">关闭</button>
      </div>
    </div>
  </div>
