<div class="modal-mask" id="json-modal" hidden>
    <div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="json-modal-title">
      <h3 id="json-modal-title">预览结果 JSON</h3>
      <div class="modal-note" id="json-file"></div>
      <textarea class="json-view" id="json-body" spellcheck="false" readonly></textarea>
      <p class="modal-error" id="json-error" hidden></p>
      <div class="modal-actions">
        <button class="btn ghost" id="btn-json-copy">复制到剪贴板</button>
        <button class="btn ghost" id="btn-json-save" hidden>保存修改</button>
        <span class="spacer"></span>
        <button class="btn primary" id="btn-json-close">关闭</button>
      </div>
    </div>
  </div>
