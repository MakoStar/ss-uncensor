<div class="modal-mask" id="launcher-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="launcher-modal-title">
      <h3 id="launcher-modal-title">启动测试</h3>
      <p class="modal-note">对搜索到的启动器 <strong>xtlr.exe</strong> 做快捷方式或启动测试。</p>

      <div class="launcher-actions">
        <button class="btn ghost" id="btn-shortcut-desktop">创建桌面快捷方式</button>
        <button class="btn ghost" id="btn-shortcut-startmenu">添加到开始菜单</button>
        <button class="btn ghost" id="btn-pin-startmenu">固定到开始菜单</button>
        <button class="btn primary" id="btn-launch-game">启动游戏</button>
      </div>

      <div class="modal-actions">
        <span class="spacer"></span>
        <button class="btn ghost" id="btn-launcher-close">关闭</button>
      </div>
    </div>
  </div>
