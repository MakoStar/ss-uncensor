name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag such as v1.0.0 or v1.0.0-beta.1, empty uses package.json version'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Resolve version
        id: version
        shell: bash
        run: |
          ref="${{ github.event.inputs.tag }}"
          if [ -z "$ref" ]; then ref="${{ github.ref_name }}"; fi
          if [[ "$ref" != v* ]]; then ref="v$(node -p "require('./package.json').version")"; fi
          if ! echo "$ref" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)(\.[0-9]+)?)?$'; then
            echo "invalid release tag: $ref" >&2
            echo "allowed: vX.Y.Z, vX.Y.Z-alpha[.N], vX.Y.Z-beta[.N], vX.Y.Z-rc[.N]" >&2
            exit 1
          fi
          echo "tag=$ref" >> "$GITHUB_OUTPUT"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"

      - name: Sync package.json version
        shell: bash
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version='${{ steps.version.outputs.version }}';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          node -p "'version -> ' + require('./package.json').version"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: |
          pnpm typecheck:node
          pnpm typecheck:web

      - name: Self test
        timeout-minutes: 8
        run: pnpm selftest

      - name: Build installer
        run: |
          pnpm build
          npx electron-builder --win nsis --config --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Package portable zip
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $src = "release/win-unpacked"
          if (-not (Test-Path $src)) { throw "win-unpacked is missing, electron-builder probably failed" }

          $stage = "release/stage/ssuncensor"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item "$src/*" $stage -Recurse -Force

          $out = "release/ssuncensor-$version-win-x64.zip"
          if (Test-Path $out) {
              Remove-Item $out -Force
          }
          Compress-Archive -Path $stage -DestinationPath $out -CompressionLevel Optimal -Force
          Remove-Item "release/stage" -Recurse -Force

          $mb = [math]::Round((Get-Item $out).Length / 1MB, 1)
          Write-Host "portable: $out ($mb MB)"

      - name: Write checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path release -File | Where-Object { $_.Extension -in '.exe', '.zip' }
          $lines = $files | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          Set-Content -Path release/SHA256SUMS.txt -Value $lines -Encoding utf8
          Get-Content release/SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ssuncensor-${{ steps.version.outputs.version }}
          path: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: |
            | File | Description |
            | --- | --- |
            | `ssuncensor-${{ steps.version.outputs.version }}-setup.exe` | Installer with start menu and desktop shortcuts plus an uninstaller |
            | `ssuncensor-${{ steps.version.outputs.version }}-win-x64.zip` | Portable build, extract the `ssuncensor/` folder and run the exe inside |
            | `SHA256SUMS.txt` | SHA256 checksums of the two packages above |

            Both packages are identical in features. Config, logs, `ResourceTool/` and `output/` all live inside the program folder, deleting the folder removes everything.

            **Unsigned note**: there is no code signing certificate, Windows SmartScreen will warn on first launch. Choose `More info -> Run anyway`, or run `Unblock-File <path to exe>` once to clear the mark.
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          files: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
          fail_on_unmatched_files: false
